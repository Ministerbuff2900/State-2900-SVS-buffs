<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State 2900 Minister Request</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --border: #334155;
            /* Semi-transparent dark overlay to ensure text readability on the background image */
            --background-overlay: rgba(11, 17, 32, 0.7); 
        }

        body {
            /* Fallback color if the image doesn't load */
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;

            /* Set the custom background image */
            background-image: linear-gradient(var(--background-overlay), var(--background-overlay)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Parallax effect: image stays still as the page scrolls */
        }

        .container {
            background: var(--container-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); /* Enhanced shadow for depth against the background */
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
            position: relative; /* Ensures form is always on top */
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            background-color: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .success-msg {
            display: none;
            background: #064e3b;
            color: #34d399;
            padding: 1rem;
            border-radius: 6px;
            text-align: center;
            margin-top: 1rem;
            font-weight: bold;
            border: 1px solid #047857;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>STATE 2900 MINISTER REQUEST</h1>
            <p>Register to request a state title for 30 minutes. Please respect the schedule!</p>
        </div>

        <form id="buffForm" action="https://formspree.io/f/xnpapaod" method="POST">
            
            <div class="form-group">
                <label for="playerName">In-Game Name</label>
                <input type="text" id="playerName" name="playerName" placeholder="e.g. FrostKing99" required>
            </div>

            <div class="form-group">
                <label for="alliance">Alliance Name</label>
                <input type="text" id="alliance" name="alliance" placeholder="e.g. Snowy Owls" required>
            </div>

            <div class="form-group">
                <label for="buffType">Requested Buff</label>
                <select id="buffType" name="buffType" required>
                    <option value="" disabled selected>Select a Minister Title...</option>
                    <option value="Vice President (1st Day)">Vice President (1st Day)</option>
                    <option value="Vice President (2nd Day)">Vice President (2nd Day)</option>
                    <option value="Minister of Education (4th Day)">Minister of Education (4th Day)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="speedups">Days of Speed Ups Available</label>
                <input type="number" id="speedups" name="speedups" placeholder="e.g. 15" min="0" required>
            </div>

            <div class="form-group">
                <label for="requestedTime">Requested Time Slot (UTC)</label>
                <select id="requestedTime" name="requestedTime" required>
                    <option value="" disabled selected>Select a 30-min slot...</option>
                    <option value="00:00 UTC">00:00 UTC</option>
                    <option value="00:30 UTC">00:30 UTC</option>
                    <option value="01:00 UTC">01:00 UTC</option>
                    <option value="01:30 UTC">01:30 UTC</option>
                    <option value="02:00 UTC">02:00 UTC</option>
                    <option value="02:30 UTC">02:30 UTC</option>
                    <option value="03:00 UTC">03:00 UTC</option>
                    <option value="03:30 UTC">03:30 UTC</option>
                    <option value="04:00 UTC">04:00 UTC</option>
                    <option value="04:30 UTC">04:30 UTC</option>
                    <option value="05:00 UTC">05:00 UTC</option>
                    <option value="05:30 UTC">05:30 UTC</option>
                    <option value="06:00 UTC">06:00 UTC</option>
                    <option value="06:30 UTC">06:30 UTC</option>
                    <option value="07:00 UTC">07:00 UTC</option>
                    <option value="07:30 UTC">07:30 UTC</option>
                    <option value="08:00 UTC">08:00 UTC</option>
                    <option value="08:30 UTC">08:30 UTC</option>
                    <option value="09:00 UTC">09:00 UTC</option>
                    <option value="09:30 UTC">09:30 UTC</option>
                    <option value="10:00 UTC">10:00 UTC</option>
                    <option value="10:30 UTC">10:30 UTC</option>
                    <option value="11:00 UTC">11:00 UTC</option>
                    <option value="11:30 UTC">11:30 UTC</option>
                    <option value="12:00 UTC">12:00 UTC</option>
                    <option value="12:30 UTC">12:30 UTC</option>
                    <option value="13:00 UTC">13:00 UTC</option>
                    <option value="13:30 UTC">13:30 UTC</option>
                    <option value="14:00 UTC">14:00 UTC</option>
                    <option value="14:30 UTC">14:30 UTC</option>
                    <option value="15:00 UTC">15:00 UTC</option>
                    <option value="15:30 UTC">15:30 UTC</option>
                    <option value="16:00 UTC">16:00 UTC</option>
                    <option value="16:30 UTC">16:30 UTC</option>
                    <option value="17:00 UTC">17:00 UTC</option>
                    <option value="17:30 UTC">17:30 UTC</option>
                    <option value="18:00 UTC">18:00 UTC</option>
                    <option value="18:30 UTC">18:30 UTC</option>
                    <option value="19:00 UTC">19:00 UTC</option>
                    <option value="19:30 UTC">19:30 UTC</option>
                    <option value="20:00 UTC">20:00 UTC</option>
                    <option value="20:30 UTC">20:30 UTC</option>
                    <option value="21:00 UTC">21:00 UTC</option>
                    <option value="21:30 UTC">21:30 UTC</option>
                    <option value="22:00 UTC">22:00 UTC</option>
                    <option value="22:30 UTC">22:30 UTC</option>
                    <option value="23:00 UTC">23:00 UTC</option>
                    <option value="23:30 UTC">23:30 UTC</option>
                </select>
            </div>

            <button type="submit">Join the Queue</button>
        </form>

        <div class="success-msg" id="successMsg">
            Request submitted! Please check your time slot and wait for your turn.
        </div>
    </div>

    <script>
        document.getElementById('buffForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            this.style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
            
            setTimeout(() => {
                this.submit();
            }, 1000);
        });
    </script>
</body>
</html>
